<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Tidyparse Reranker Worker</title>
    <style>
        body { font: 14px/1.4 system-ui, -apple-system, sans-serif; margin: 18px; background: #fdfdfd; }
        pre  { background: #f0f0f0; padding: 14px; border-radius: 8px; overflow: auto; font-family: ui-monospace, monospace; line-height: 1.5; }
    </style>
</head>
<body>
<h2>Tidyparse Reranker Worker</h2>
<p><b>Status:</b> <span id="status">idle</span></p>
<pre id="out">Waiting for work...</pre>

<script type="module">
    import model from "./reranker_7700.js";

    const statusEl = document.getElementById("status");
    const outEl = document.getElementById("out");

    // ===== MUST MATCH PYTHON CONSTANTS =====
    const DIM = 256, MAX_LEN_Q = 100, MAX_LEN_D = 110;
    const MAX_LEN = MAX_LEN_Q + MAX_LEN_D + 2; // 212
    const CLS_Q = 90; // '{' id
    const CLS_D = 91; // '|' id

    // ===== MODEL EXPORT SHAPE =====
    const MODEL_DOCS = 64;

    function assert(cond, msg) { if (!cond) throw new Error(msg); }

    async function initWebGPU() {
        if (!navigator.gpu) throw new Error("WebGPU not available in this browser.");
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) throw new Error("No WebGPU adapter available.");

        const requiredFeatures = adapter.features.has("shader-f16") ? ["shader-f16"] : [];
        return await adapter.requestDevice({ requiredFeatures });
    }

    // Costs match Python: ins=1, del=1, sub=2, match=0
    function levAlign(qStr, dStr) {
        const q = qStr;
        const d = dStr;
        const m = q.length, n = d.length;
        const n1 = n + 1;
        const dp = new Uint16Array((m + 1) * (n + 1));

        for (let i = 0; i <= m; i++) dp[i * n1 + 0] = i;
        for (let j = 0; j <= n; j++) dp[0 * n1 + j] = j;

        for (let i = 1; i <= m; i++) {
            const qi = q.charCodeAt(i - 1);
            const row = i * n1;
            const prow = (i - 1) * n1;
            for (let j = 1; j <= n; j++) {
                const dj = d.charCodeAt(j - 1);
                const costSub = (qi === dj) ? 0 : 2;

                const del = dp[prow + j] + 1;
                const ins = dp[row + (j - 1)] + 1;
                const sub = dp[prow + (j - 1)] + costSub;

                let best = del;
                if (ins < best) best = ins;
                if (sub < best) best = sub;
                dp[row + j] = best;
            }
        }

        const la = new Int32Array(n);
        let i = m, j = n;

        while (i > 0 || j > 0) {
            const cur = dp[i * n1 + j];

            if (i > 0 && j > 0) {
                const qi = q.charCodeAt(i - 1);
                const dj = d.charCodeAt(j - 1);
                const costSub = (qi === dj) ? 0 : 2;
                if (cur === dp[(i - 1) * n1 + (j - 1)] + costSub) {
                    la[j - 1] = (costSub === 0) ? 0 : 2;
                    i--; j--;
                    continue;
                }
            }

            if (j > 0 && (i === 0 || cur === dp[i * n1 + (j - 1)] + 1)) {
                la[j - 1] = 1;
                j--;
                continue;
            }

            i--;
        }

        return la;
    }

    function buildLAFull(queryStr, docStr) {
        const q = queryStr.slice(0, MAX_LEN_Q);
        const d = docStr.slice(0, MAX_LEN_D);
        const laDoc = levAlign(q, d);
        const laFull = new Int32Array(MAX_LEN);
        const base = MAX_LEN_Q + 2;
        laFull.set(laDoc, base);
        return laFull;
    }

    // Python map: {chr(i): i - 33 for i in range(33, 127)}
    function encodeStr(str, maxLen) {
        const ids = new Int32Array(maxLen);
        for (let i = 0; i < maxLen; i++) {
            if (i < str.length) {
                const code = str.charCodeAt(i) - 33;
                ids[i] = (code >= 0 && code < 94) ? code : 0;
            } else {
                ids[i] = 0;
            }
        }
        return ids;
    }

    function buildQueryBuffers(queryStr) {
        const qIds = encodeStr(queryStr, MAX_LEN_Q);

        const x_q = new Int32Array(MAX_LEN);
        x_q[0] = CLS_Q;
        x_q.set(qIds, 1);
        x_q[MAX_LEN_Q + 1] = CLS_D;

        const la_q = new Int32Array(MAX_LEN);
        return { x_q, la_q, qIds };
    }

    function writeDocRow(x_d, la_d, rowIndex, qIds, queryStr, docStr) {
        const dIds = encodeStr(docStr, MAX_LEN_D);
        const offset = rowIndex * MAX_LEN;

        x_d[offset] = CLS_Q;
        x_d.set(qIds, offset + 1);
        x_d[offset + MAX_LEN_Q + 1] = CLS_D;
        x_d.set(dIds, offset + MAX_LEN_Q + 2);

        const laFull = buildLAFull(queryStr, docStr);
        la_d.set(laFull, offset);
    }

    function unpackScores(ret) {
        if (Array.isArray(ret)) {
            if (ret.length === 1 && (ret[0] instanceof Float32Array || ArrayBuffer.isView(ret[0]))) return ret[0];
            if (ret.length === 1 && Array.isArray(ret[0])) return unpackScores(ret[0]);
            if (ret.length && typeof ret[0] === "number") return Float32Array.from(ret);
        }
        if (ret instanceof Float32Array || ArrayBuffer.isView(ret)) return ret;
        throw new Error("Could not unpack model output into scores array");
    }

    async function scoreDocs(net, queryStr, docStrings) {
        if (!docStrings.length) return new Float32Array(0);

        const { x_q, la_q, qIds } = buildQueryBuffers(queryStr);
        const scoresAll = new Float32Array(docStrings.length);

        const x_d = new Int32Array(MODEL_DOCS * MAX_LEN);
        const la_d = new Int32Array(MODEL_DOCS * MAX_LEN);

        for (let base = 0; base < docStrings.length; base += MODEL_DOCS) {
            const chunkCount = Math.min(MODEL_DOCS, docStrings.length - base);

            for (let i = 0; i < MODEL_DOCS; i++) {
                const docStr = (i < chunkCount) ? docStrings[base + i] : "";
                writeDocRow(x_d, la_d, i, qIds, queryStr, docStr);
            }

            const ret = await net(x_q, la_q, x_d, la_d);
            const chunkScores = unpackScores(ret);
            assert(chunkScores.length === MODEL_DOCS, `Expected ${MODEL_DOCS} scores, got ${chunkScores.length}`);

            for (let i = 0; i < chunkCount; i++) {
                scoresAll[base + i] = chunkScores[i];
            }
        }

        return scoresAll;
    }

    function sortedDocsByScore(docs, scores) {
        const idx = Array.from({ length: docs.length }, (_, i) => i)
            .sort((a, b) => scores[b] - scores[a]);
        return idx.map(i => docs[i]);
    }

    function buildResultBody(id, docs) {
        const p = new URLSearchParams();
        p.set("id", String(id));
        for (const d of docs) p.append("d", d);
        return p.toString();
    }

    async function handleJob(net, event) {
        const params = new URLSearchParams(event.data);
        const id = params.get("id");
        const query = params.get("q") ?? "";
        const docs = params.getAll("d");

        statusEl.textContent = `Scoring ${docs.length} docs...`;
        outEl.textContent =
            `Request ${id}\n` +
            `Query: ${query}\n` +
            `Docs : ${docs.length}\n`;

        const e0 = Array.from(encodeStr(docs[0] ?? "", MAX_LEN_D));
        const e1 = Array.from(encodeStr(docs[1] ?? "", MAX_LEN_D));

        console.log("doc0 == doc1 after encode?",
            e0.length === e1.length && e0.every((v, i) => v === e1[i]));

        console.log("doc0 first 40:", e0.slice(0, 40));
        console.log("doc1 first 40:", e1.slice(0, 40));
        const a0 = Array.from(buildLAFull(query, docs[0] ?? ""));
        const a1 = Array.from(buildLAFull(query, docs[1] ?? ""));

        console.log("la0 == la1?",
            a0.length === a1.length && a0.every((v, i) => v === a1[i]));

        console.log("la0 doc segment:", a0.slice(MAX_LEN_Q + 2, MAX_LEN_Q + 22));
        console.log("la1 doc segment:", a1.slice(MAX_LEN_Q + 2, MAX_LEN_Q + 22));

        const scores = await scoreDocs(net, query, docs);

        const arr = Array.from(scores);
        const finite = arr.filter(Number.isFinite);

        console.log("scores:", arr.slice(0, 16));
        console.log("min/max:", finite.length ? Math.min(...finite) : "none", finite.length ? Math.max(...finite) : "none");
        console.log("nan count:", arr.filter(x => !Number.isFinite(x)).length);

        const sorted = sortedDocsByScore(docs, scores);

        await fetch("/result", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
            body: buildResultBody(id, sorted),
        });

        statusEl.textContent = "Ready";
        outEl.textContent =
            `Request ${id} complete.\n` +
            `Top result:\n${sorted[0] ?? "(none)"}`;
    }

    async function main() {
        statusEl.textContent = "Requesting WebGPU device...";
        const device = await initWebGPU();

        statusEl.textContent = "Loading weights & building pipelines...";
        const net = await model.load(device, "./reranker_7700.safetensors");

        statusEl.textContent = "Ready";
        outEl.textContent = "Model loaded. Waiting for /stream jobs...";

        const es = new EventSource("/stream");

        es.onmessage = async (event) => {
            try {
                await handleJob(net, event);
            } catch (e) {
                statusEl.textContent = "Job failed";
                outEl.textContent = String(e?.stack || e);
                // Still try to return *something* so Kotlin does not hang forever.
                const params = new URLSearchParams(event.data);
                const id = params.get("id");
                if (id != null) {
                    await fetch("/result", {
                        method: "POST",
                        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
                        body: new URLSearchParams({ id }).toString(),
                    }).catch(() => {});
                }
            }
        };
    }

    main().catch(e => {
        statusEl.textContent = "Fatal error";
        outEl.textContent = String(e?.stack || e);
    });
</script>
</body>
</html>
